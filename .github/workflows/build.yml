name: Build WindowsTabs

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar e gerar WindowsTabs.jar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: |
          mkdir -p build/classes
          find . -name "*.java" -not -path "./build/*" > build/sources.txt
          cat build/sources.txt
          javac --release 17 -encoding UTF-8 -Xlint:all -d build/classes @build/sources.txt

      - name: Gerar WindowsTabs.jar
        run: |
          jar --create --file WindowsTabs.jar --main-class com.windowstabs.Main -C build/classes .
          echo "Conteudo do JAR:"
          jar --list --file WindowsTabs.jar
          echo "Manifest:"
          unzip -p WindowsTabs.jar META-INF/MANIFEST.MF

      - name: Publicar o JAR em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTabs
          path: WindowsTabs.jar
          if-no-files-found: error
